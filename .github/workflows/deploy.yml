name: Deploy skorpluss.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # 1. Pastikan folder utama ada dan masuk ke direktori
            mkdir -p /var/www/skorpluss
            cd /var/www/skorpluss
            
            # 2. Force Sync Repository dengan branch main (bersihkan file lokal yang konflik)
            if [ -d ".git" ]; then
              # Revert ownership back to the host user so git doesn't throw Permission denied
              sudo chown -R $USER:$USER . 2>/dev/null || docker run --rm -v $(pwd):/var/www/html alpine chown -R $(id -u):$(id -g) /var/www/html || true
              
              git reset --hard HEAD
              git clean -fd
              git fetch origin main
              git checkout -B main origin/main
              git reset --hard origin/main
            else
              git clone https://github.com/barengs/skorplus.git .
            fi
            
            # 3. Copy .env jika belum ada
            if [ ! -f ".env" ]; then
              cp .env.example .env
            fi
            
            # 4. Bangun dan nyalakan Docker Container
            docker compose up -d --build
            
            # 5. Instalasi dependensi backend Laravel
            docker compose exec -T app composer install --optimize-autoloader --no-dev
            docker compose exec -T app php artisan key:generate --force
            docker compose exec -T app php artisan jwt:secret --always-no
            
            # 6. Migrasi Database PostgreSQL & Seed Data Baru (Full Seeder)
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan db:seed --force
            
            # 7. Setup Storage Symlink (Hapus yang lama, buat baru)
            docker compose exec -T app rm -rf /var/www/html/public/storage || true
            docker compose exec -T app php artisan storage:link
            
            # 8. Build Frontend (React / Vite) - force fresh container
            docker compose run --rm node
            
            # 9. Optimasi Cache Laravel
            docker compose exec -T app php artisan view:clear
            docker compose exec -T app php artisan route:clear
            docker compose exec -T app php artisan config:clear
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            
            # 10. Perbaiki Hak Akses Folder (SANGAT PENTING)
            docker compose exec -T app mkdir -p /var/www/html/storage/framework/views /var/www/html/storage/framework/cache/data /var/www/html/storage/framework/sessions /var/www/html/storage/logs /var/www/html/bootstrap/cache
            docker compose exec -T app chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache /var/www/html/public/build /var/www/html/public/storage
            docker compose exec -T app chmod -R 777 /var/www/html/storage /var/www/html/bootstrap/cache
            
            # 11. Restart Container (App & Web) agar konfigurasi baru terbaca & PHP-FPM di-refresh
            docker compose restart app web